<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Account Locked</title>
	<style>
		body { font-family: Arial, sans-serif; text-align: center; padding-top: 100px; background-color: #f8f9fa; }
		.container { max-width: 500px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
		h1 { color: #dc3545; }
	</style>
</head>
<body>
	<div class="container">
		<h1>Access Denied</h1>
		<p>This account or IP address has been temporarily locked due to too many failed login attempts.</p>
		<p>Please try again later or contact the system administrator.</p>
	</div>
</body>
</html>
