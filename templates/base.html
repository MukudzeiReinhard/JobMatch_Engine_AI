<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Recommendation System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa6mY6M3jYk0j2UBwK0qQleIpskK7Sj+7AVS5+0n0d7Jw3pjDZGEaHcK/i8" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .page-wrapper {
            padding-top: 1rem;
            padding-bottom: 2rem;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="bg-white shadow-sm mb-4">
        <div class="container px-3 py-3">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
                <div>
                    <h1 class="h4 mb-0">Job Recommendation</h1>
                    <p class="text-muted mb-0">Responsive job matching and profile management.</p>
                </div>
                <div class="d-flex gap-2 flex-wrap align-items-center">
                    <a href="{% url 'job_list' %}" class="btn btn-sm btn-outline-primary">Jobs</a>
                    {% if user.is_authenticated %}
                        <a href="{% url 'employee_profile' %}" class="btn btn-sm btn-outline-secondary">My Profile</a>
                        {% if user.employee_account.role == 'HR' %}
                            <a href="{% url 'hr_dashboard' %}" class="btn btn-sm btn-primary">HR Dashboard</a>
                        {% endif %}
                    {% endif %}
                </div>
            </div>
        </div>
    </header>
    <main class="page-wrapper">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
